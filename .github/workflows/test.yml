name: Test Python application

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.13', '3.14']

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (Qt & Wayland)
      run: |
        sudo apt-get update
        sudo apt-get install -y xvfb libegl1 libdbus-1-3 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 x11-utils \
        cmake ninja-build qt6-base-dev qt6-base-private-dev libwayland-dev liblayershellqtinterface-dev libpulse0 pkg-config build-essential

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[test]"

    - name: Build sdist and wheel
      run: |
        python -m pip install build
        python -m build --sdist --wheel --outdir /tmp/bilihud-dist
        python - <<'PY'
        from pathlib import Path
        import tarfile
        import zipfile

        output_dir = Path("/tmp/bilihud-dist")
        wheel = next(output_dir.glob("*.whl"))
        sdist = next(output_dir.glob("*.tar.gz"))

        with zipfile.ZipFile(wheel) as archive:
            names = set(archive.namelist())
            assert "bilihud/libbili-layer.so" in names
            wheel_metadata = archive.read(next(name for name in names if name.endswith(".dist-info/WHEEL")))
            assert b"Root-Is-Purelib: false" in wheel_metadata
            assert b"Tag: cp" in wheel_metadata
            assert b"-linux_" in wheel_metadata

        with tarfile.open(sdist) as archive:
            names = set(archive.getnames())
            assert any(name.endswith("/CMakeLists.txt") for name in names)
            assert any(name.endswith("/src/bilihud/layer_shell_bridge.cpp") for name in names)
            assert any(name.endswith("/vendor/blivedm/blivedm/__init__.py") for name in names)
        PY

    - name: Lint with ruff
      run: |
        # stop the build if there are Python syntax errors or undefined names
        ruff check --select=E9,F63,F7,F82 src/
        # exit-zero treats all errors as warnings
        ruff check --exit-zero --statistics src/

    - name: Check architecture boundaries
      run: pytest tests/test_architecture.py

    - name: Run tests
      run: |
        xvfb-run pytest

  platform-adapters:
    name: Platform adapters (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.13
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ".[test]"

    - name: Run pure Python platform checks
      run: >-
        python -m pytest -q
        tests/config/test_config.py
        tests/live/test_obs_api.py
        tests/platform/test_paths.py
        tests/platform/test_obs_process.py
        tests/test_architecture.py
